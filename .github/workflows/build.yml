name: Build PotatoFix

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Inspect Minecraft mappings
        run: |
          gradle help --no-daemon

          echo "=== Minecraft render classes ==="

          find ~/.gradle/caches/fabric-loom .gradle/loom-cache \
            -type f -name "*.jar" 2>/dev/null |
          while read jarfile; do
            jar tf "$jarfile" 2>/dev/null |
            grep -E 'EntityRender(Dispatcher|Manager)|BlockEntityRender(Dispatcher|Manager)' |
            sed "s|^|$jarfile: |"
          done

      - name: Build JAR
        run: gradle build --no-daemon

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PotatoFix-JAR
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
